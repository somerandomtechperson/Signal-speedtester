<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Signal — Wifi Speed Test</title>
  <style>
    :root {
      --bg: #0a0f1a;
      --panel: #111a29;
      --border: rgba(169,190,220,.13);
      --text: #edf4ff;
      --muted: #95a5bd;
      --blue: #65a9ff;
      --cyan: #54e1d2;
      --green: #8ce4b1;
      --orange: #f5c27b;
      --danger: #ff8d9b;
      --shadow: 0 18px 52px rgba(0,0,0,.22);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 12% 0%, rgba(44,105,184,.17), transparent 34rem),
                  radial-gradient(ellipse at 88% 16%, rgba(40,190,177,.08), transparent 30rem),
                  var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .shell {
      max-width: 1240px;
      margin: 0 auto;
      padding: 26px 26px 32px;
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: 21px;
      background: linear-gradient(155deg, rgba(19,30,48,.96), rgba(14,22,36,.98));
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 1px 26px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-icon {
      width: 43px;
      height: 43px;
      border: 1px solid rgba(101,169,255,.27);
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, rgba(101,169,255,.18), rgba(84,225,210,.06));
      color: var(--blue);
      font-weight: 800;
      font-size: 20px;
    }

    .brand h1 {
      font-size: 19px;
      line-height: 1.1;
      margin: 0;
      font-weight: 740;
      letter-spacing: -.035em;
    }

    .brand p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .015em;
      text-transform: uppercase;
    }

    .top-status {
      display: flex;
      align-items: center;
      gap: 9px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 9px 13px;
      color: #bfd1e7;
      font-size: 12px;
      background: rgba(17,26,41,.7);
      white-space: nowrap;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(140,228,177,.1);
    }

    .dot.offline {
      background: var(--danger);
      box-shadow: 0 0 0 4px rgba(255,141,155,.1);
    }

    .content {
      padding: 22px;
    }

    .stage-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
      margin: 2px 0 0;
      min-height: 20px;
    }

    .stage-live {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      display: inline-block;
    }

    .stage-live.pulse {
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(84,225,210,.28); }
      50% { opacity: .65; box-shadow: 0 0 0 5px rgba(84,225,210,0); }
    }

    .gauge-wrap {
      position: relative;
      max-width: 500px;
      width: 100%;
      height: 230px;
      margin: 0 auto 4px;
    }

    #gaugeCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .gauge-center {
      position: absolute;
      left: 50%;
      bottom: 20%;
      transform: translateX(-50%);
      width: 68%;
      text-align: center;
      pointer-events: none;
    }

    .gauge-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .18em;
      color: #9db0c8;
      font-weight: 780;
      margin-bottom: 7px;
    }

    .gauge-number-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 7px;
      line-height: 1;
    }

    .gauge-number {
      font-size: clamp(44px, 6.5vw, 62px);
      font-weight: 760;
      letter-spacing: -.075em;
      font-variant-numeric: tabular-nums;
      min-width: 2ch;
    }

    .gauge-unit {
      font-size: 14px;
      color: #a2b4cc;
      font-weight: 650;
    }

    .gauge-note {
      font-size: 11px;
      color: #859ab6;
      margin-top: 8px;
      min-height: 15px;
      line-height: 1.3;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 2px;
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 12px 19px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
      transition: filter .15s ease, transform .15s ease;
      font-family: inherit;
    }

    .btn:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { opacity: .42; cursor: not-allowed; }
    .btn[hidden] { display: none !important; }

    .btn-primary {
      color: #081626;
      background: linear-gradient(100deg, #79b6ff, #6ce0d4);
      box-shadow: 0 7px 25px rgba(69,158,216,.2);
      min-width: 178px;
    }

    .btn-danger {
      color: #ffc0c8;
      border-color: rgba(255,141,155,.2);
      background: rgba(255,141,155,.06);
    }

    .toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 14px auto 0;
      font-size: 11px;
      color: #8ea3be;
      cursor: pointer;
      user-select: none;
      max-width: 440px;
      text-align: center;
    }

    .toggle input {
      accent-color: var(--cyan);
    }

    .progress-wrap {
      margin: 17px auto 0;
      max-width: 500px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 10px;
      color: #8396b0;
      margin-bottom: 7px;
    }

    .progress-track {
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: #243148;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--blue), var(--cyan));
      transition: width .25s ease;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 18px;
    }

    .metric {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 15px 14px 14px;
      background: rgba(8,15,26,.32);
      min-height: 105px;
      overflow: hidden;
    }

    .metric-label {
      font-size: 11px;
      color: #9aadc5;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .metric-icon {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: rgba(101,169,255,.09);
      color: var(--blue);
      font-weight: 700;
    }

    .metric-value {
      margin-top: 12px;
      font-size: 26px;
      font-weight: 735;
      letter-spacing: -.055em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .metric-value .unit {
      font-size: 10px;
      letter-spacing: 0;
      color: #91a6c1;
      font-weight: 650;
      margin-left: 4px;
    }

    .metric-caption {
      font-size: 10px;
      color: #788da8;
      margin-top: 7px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history {
      margin-top: 22px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .history-box {
      max-height: 260px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(8,15,26,.24);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 510px;
    }

    th, td {
      padding: 12px 10px;
      text-align: left;
      font-size: 11px;
      border-bottom: 1px solid rgba(169,190,220,.08);
      color: #d4e0ef;
      font-variant-numeric: tabular-nums;
    }

    th {
      position: sticky;
      top: 0;
      background: #121c2d;
      color: #8197b2;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 750;
      font-size: 10px;
    }

    .empty {
      padding: 28px 10px;
      text-align: center;
      color: #8297b1;
      font-size: 11px;
      line-height: 1.7;
    }

    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      max-width: min(400px, calc(100vw - 32px));
      padding: 13px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #18253a;
      color: #eaf3ff;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .2s ease, transform .2s ease;
      pointer-events: none;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 820px) {
      .shell { padding: 20px 18px 27px; }
      .metrics { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">S</div>
        <div>
          <h1>Signal<span style="color:var(--cyan)">.</span></h1>
          <p>Wifi performance lab</p>
        </div>
      </div>
      <div class="top-status"><span id="onlineDot" class="dot"></span><span id="onlineLabel">Checking connection…</span></div>
    </header>

    <main class="content">
      <div class="stage-row" aria-live="polite"><span id="stageDot" class="stage-live"></span><span id="stageText">Ready when you are.</span></div>

      <div class="gauge-wrap">
        <canvas id="gaugeCanvas" role="img" aria-label="Live speedometer"></canvas>
        <div class="gauge-center">
          <div class="gauge-title" id="gaugeTitle">Download speed</div>
          <div class="gauge-number-row">
            <span class="gauge-number" id="gaugeNumber">0.0</span>
            <span class="gauge-unit" id="gaugeUnit">Mbps</span>
          </div>
          <div class="gauge-note" id="gaugeNote">Press start to measure.</div>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="startBtn" type="button">Start speed test</button>
        <button class="btn btn-danger" id="cancelBtn" type="button" hidden>Cancel</button>
      </div>

      <label class="toggle"><input type="checkbox" id="lightToggle"><span>Data saver mode</span></label>

      <div class="progress-wrap">
        <div class="progress-meta"><span id="progressLabel">Test progress</span><span id="progressPercent">0%</span></div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>

      <div class="metrics">
        <div class="metric">
          <div class="metric-label"><span class="metric-icon">↓</span> Download</div>
          <div class="metric-value"><span id="downloadValue">—</span><span class="unit">Mbps</span></div>
          <div class="metric-caption" id="downloadCaption">Waiting for result</div>
        </div>
        <div class="metric">
          <div class="metric-label"><span class="metric-icon">↑</span> Upload</div>
          <div class="metric-value"><span id="uploadValue">—</span><span class="unit">Mbps</span></div>
          <div class="metric-caption" id="uploadCaption">Waiting for result</div>
        </div>
        <div class="metric">
          <div class="metric-label"><span class="metric-icon">◌</span> Ping</div>
          <div class="metric-value"><span id="pingValue">—</span><span class="unit">ms</span></div>
          <div class="metric-caption">Round-trip latency</div>
        </div>
        <div class="metric">
          <div class="metric-label"><span class="metric-icon">⟡</span> Jitter</div>
          <div class="metric-value"><span id="jitterValue">—</span><span class="unit">ms</span></div>
          <div class="metric-caption">Variance between pings</div>
        </div>
      </div>

      <div class="history">
        <div class="history-box" id="historyContent"></div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'signal-speedtest-history-v1';
      const API_DOWN = 'https://speed.cloudflare.com/__down';
      const API_UP = 'https://speed.cloudflare.com/__up';
      const MAX_HISTORY = 10;

      const $ = (id) => document.getElementById(id);
      const els = {
        onlineDot: $('onlineDot'),
        onlineLabel: $('onlineLabel'),
        stageDot: $('stageDot'),
        stageText: $('stageText'),
        gaugeCanvas: $('gaugeCanvas'),
        gaugeTitle: $('gaugeTitle'),
        gaugeNumber: $('gaugeNumber'),
        gaugeUnit: $('gaugeUnit'),
        gaugeNote: $('gaugeNote'),
        startBtn: $('startBtn'),
        cancelBtn: $('cancelBtn'),
        lightToggle: $('lightToggle'),
        progressLabel: $('progressLabel'),
        progressPercent: $('progressPercent'),
        progressFill: $('progressFill'),
        downloadValue: $('downloadValue'),
        uploadValue: $('uploadValue'),
        pingValue: $('pingValue'),
        jitterValue: $('jitterValue'),
        downloadCaption: $('downloadCaption'),
        uploadCaption: $('uploadCaption'),
        historyContent: $('historyContent'),
        toast: $('toast')
      };

      const S = {
        running: false,
        controller: null,
        light: false,
        history: [],
        toastTimer: 0,
        gauge: { value: 0, max: 10 }
      };

      function setOnlineStatus() {
        const online = navigator.onLine;
        els.onlineDot.classList.toggle('offline', !online);
        els.onlineLabel.textContent = online ? 'Browser reports online' : 'Browser reports offline';
      }

      function showToast(message) {
        clearTimeout(S.toastTimer);
        els.toast.textContent = message;
        els.toast.classList.add('show');
        S.toastTimer = setTimeout(() => els.toast.classList.remove('show'), 3200);
      }

      function setStage(text, running) {
        els.stageText.textContent = text;
        els.stageDot.classList.toggle('pulse', !!running);
      }

      function setProgress(value, label) {
        const pct = Math.max(0, Math.min(100, value));
        els.progressFill.style.width = pct + '%';
        els.progressPercent.textContent = Math.round(pct) + '%';
        if (label) els.progressLabel.textContent = label;
      }

      function setGaugeTarget(value, max, title, note, unit) {
        S.gauge.value = Number.isFinite(value) ? Math.max(0, value) : 0;
        S.gauge.max = Math.max(1, max || 10);
        els.gaugeTitle.textContent = title;
        els.gaugeNote.textContent = note;
        els.gaugeUnit.textContent = unit;
        els.gaugeNumber.textContent = Number.isFinite(value) ? value.toFixed(1) : '0.0';
        drawGauge();
      }

      function drawGauge() {
        const canvas = els.gaugeCanvas;
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = rect.width || 360;
        const h = rect.height || 220;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);

        const cx = w / 2;
        const cy = h * 0.82;
        const radius = Math.min(w * 0.38, h * 0.7);

        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(cx, cy, radius, Math.PI, Math.PI * 2);
        ctx.lineWidth = 10;
        ctx.strokeStyle = 'rgba(123,150,188,.15)';
        ctx.stroke();

        const fraction = Math.max(0, Math.min(1, S.gauge.value / S.gauge.max));
        const arcAngle = Math.PI + (Math.PI * fraction);
        const px = cx + Math.cos(arcAngle) * radius;
        const py = cy + Math.sin(arcAngle) * radius;

        const gradient = ctx.createLinearGradient(cx - radius, cy, cx + radius, cy);
        gradient.addColorStop(0, '#65a9ff');
        gradient.addColorStop(1, '#54e1d2');

        ctx.beginPath();
        ctx.arc(cx, cy, radius, Math.PI, Math.PI + Math.PI * fraction);
        ctx.lineWidth = 10;
        ctx.strokeStyle = gradient;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(px, py, 3, 0, Math.PI * 2);
        ctx.fillStyle = '#eef9ff';
        ctx.fill();
      }

      function loadHistory() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          S.history = raw ? JSON.parse(raw) : [];
        } catch (_) {
          S.history = [];
        }
        if (!Array.isArray(S.history)) S.history = [];
        renderHistory();
      }

      function saveHistory() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(S.history.slice(0, MAX_HISTORY)));
        } catch (_) {
          showToast('Local storage is restricted in this browser; this run was not saved.');
        }
        renderHistory();
      }

      function formatDate(iso) {
        try {
          return new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
        } catch (_) {
          return '—';
        }
      }

      function renderHistory() {
        if (!S.history.length) {
          els.historyContent.innerHTML = '<div class="empty">No tests saved yet. Run a speed test to populate your history.</div>';
          return;
        }

        const rows = S.history.slice(0, MAX_HISTORY).map(item => `
          <tr>
            <td>${formatDate(item.date)}</td>
            <td>${Number(item.download || 0).toFixed(1)} Mbps</td>
            <td>${Number(item.upload || 0).toFixed(1)} Mbps</td>
            <td>${Number(item.ping || 0).toFixed(1)} ms</td>
            <td>${Number(item.jitter || 0).toFixed(1)} ms</td>
          </tr>
        `).join('');

        els.historyContent.innerHTML = `
          <table>
            <thead><tr><th>Date</th><th>Download</th><th>Upload</th><th>Ping</th><th>Jitter</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        `;
      }

      function makeUrl(base, params = {}) {
        const url = new URL(base);
        for (const [k, v] of Object.entries(params)) url.searchParams.set(k, String(v));
        return url.toString();
      }

      async function measurePing(signal) {
        const t0 = performance.now();
        const url = makeUrl(API_DOWN, { bytes: 64, r: Math.random().toString(36).slice(2) });
        const response = await fetch(url, { signal, cache: 'no-store' });
        if (!response.ok) throw new Error('Ping request failed');
        await response.arrayBuffer();
        return performance.now() - t0;
      }

      async function measureDownload(signal) {
        const size = 4 * 1024 * 1024;
        const start = performance.now();
        const url = makeUrl(API_DOWN, { bytes: size, r: Math.random().toString(36).slice(2) });
        const response = await fetch(url, { signal, cache: 'no-store' });
        if (!response.ok) throw new Error('Download request failed');
        const bytes = await response.arrayBuffer();
        const elapsed = Math.max((performance.now() - start) / 1000, 0.1);
        const mbps = ((bytes.byteLength * 8) / elapsed) / 1_000_000;
        return mbps;
      }

      async function measureUpload(signal) {
        const size = 2 * 1024 * 1024;
        const payload = new Uint8Array(size);
        const start = performance.now();
        const response = await fetch(API_UP, {
          method: 'POST',
          body: payload,
          signal,
          cache: 'no-store'
        });
        if (!response.ok) throw new Error('Upload request failed');
        await response.arrayBuffer();
        const elapsed = Math.max((performance.now() - start) / 1000, 0.1);
        return ((size * 8) / elapsed) / 1_000_000;
      }

      async function runLatencyTest() {
        const samples = [];
        setStage('Measuring latency…', true);
        setGaugeTarget(0, 200, 'Latency', 'Round trip to the nearest Cloudflare server', 'ms');
        setProgress(12, 'Checking latency');

        for (let i = 0; i < 6; i++) {
          if (S.controller && S.controller.signal.aborted) throw new DOMException('Test cancelled', 'AbortError');
          const sample = await measurePing(S.controller.signal);
          samples.push(sample);
          const value = samples.slice().sort((a, b) => a - b)[Math.floor(samples.length / 2)] || sample;
          const drift = samples.length > 1 ? samples.slice(1).reduce((acc, current, idx) => acc + Math.abs(current - samples[idx]), 0) / (samples.length - 1) : 0;
          els.pingValue.textContent = value.toFixed(1);
          els.jitterValue.textContent = drift.toFixed(1);
          setGaugeTarget(value, 200, 'Latency', 'Round trip to the nearest Cloudflare server', 'ms');
          setProgress(12 + (i + 1) * 12, 'Checking latency');
          await new Promise(resolve => setTimeout(resolve, 120));
        }

        return {
          ping: Number(els.pingValue.textContent || 0),
          jitter: Number(els.jitterValue.textContent || 0)
        };
      }

      async function runDownloadTest() {
        setStage('Measuring download speed…', true);
        setGaugeTarget(0, 250, 'Download speed', 'Receiving test data', 'Mbps');
        setProgress(42, 'Measuring download');
        const speed = await measureDownload(S.controller.signal);
        els.downloadValue.textContent = speed.toFixed(1);
        els.downloadCaption.textContent = 'Measured this run';
        setGaugeTarget(speed, 250, 'Download speed', 'Download complete', 'Mbps');
        return speed;
      }

      async function runUploadTest() {
        setStage('Measuring upload speed…', true);
        setGaugeTarget(0, 120, 'Upload speed', 'Sending test data', 'Mbps');
        setProgress(72, 'Measuring upload');
        const speed = await measureUpload(S.controller.signal);
        els.uploadValue.textContent = speed.toFixed(1);
        els.uploadCaption.textContent = 'Measured this run';
        setGaugeTarget(speed, 120, 'Upload speed', 'Upload complete', 'Mbps');
        return speed;
      }

      async function runTest() {
        if (S.running) return;

        S.running = true;
        S.controller = new AbortController();
        els.startBtn.disabled = true;
        els.cancelBtn.hidden = false;
        els.lightToggle.disabled = true;
        setProgress(0, 'Starting test');
        setStage('Preparing test…', true);

        try {
          const pingResult = await runLatencyTest();
          const download = await runDownloadTest();
          const upload = await runUploadTest();
          const item = {
            date: new Date().toISOString(),
            download,
            upload,
            ping: pingResult.ping,
            jitter: pingResult.jitter
          };

          S.history.unshift(item);
          S.history = S.history.slice(0, MAX_HISTORY);
          saveHistory();
          setProgress(100, 'Test complete');
          setStage('Complete', false);
          showToast('Speed test complete. Results saved locally.');
        } catch (error) {
          if (error && error.name === 'AbortError') {
            setStage('Cancelled', false);
            showToast('Test cancelled.');
          } else {
            setStage('Error', false);
            showToast('The speed test failed. Please try again.');
          }
        } finally {
          S.running = false;
          S.controller = null;
          els.startBtn.disabled = false;
          els.cancelBtn.hidden = true;
          els.lightToggle.disabled = false;
          setProgress(100, 'Ready');
          setStage('Ready when you are.', false);
        }
      }

      els.startBtn.addEventListener('click', runTest);
      els.cancelBtn.addEventListener('click', () => {
        if (S.controller) S.controller.abort();
      });
      els.lightToggle.addEventListener('change', event => {
        S.light = !!event.target.checked;
        showToast(S.light ? 'Data saver mode enabled.' : 'Data saver mode disabled.');
      });

      window.addEventListener('online', setOnlineStatus);
      window.addEventListener('offline', setOnlineStatus);
      window.addEventListener('resize', drawGauge);

      setOnlineStatus();
      loadHistory();
      setGaugeTarget(0, 10, 'Download speed', 'Press start to measure.', 'Mbps');
      setProgress(0, 'Ready');
    })();
  </script>
</body>
</html>
